<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      console.error("🚨 ERRO CAPTURADO:", message, "Linha:", lineno, "Stack:", error ? error.stack : "Stack indisponível");
      return true;
    };

    // Função para executar um "Hard Refresh" completo da PWA
    async function handleHardPWARefresh() {
      console.log('Iniciando limpeza de cache da PWA...');

      // Etapa 1: Limpar todos os caches gerenciados pela API do Service Worker
      if ('caches' in window) {
        try {
          // Obtém todos os nomes de cache registrados
          const cacheNames = await caches.keys();
          // Exclui cada cache
          await Promise.all(
            cacheNames.map(cacheName => {
              console.log(`Excluindo cache: ${cacheName}`);
              return caches.delete(cacheName);
            })
          );
          console.log('Todos os caches da PWA foram excluídos.');
        } catch (error) {
          console.error('Erro ao excluir caches:', error);
        }
      } else {
        console.warn('Caches API não disponível neste navegador.');
      }

      // Etapa 2: Recarregar a página forçando o servidor
      console.log('Recarregando página...');
      window.location.reload();
    }
  </script>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">

  <!-- Viewport obrigatório para mobile e PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- SEO -->
  <title>Dojo Manager — CT Pandora</title>
  <meta name="description" content="Sistema de gestão de alunos, check-in por QR Code e mensalidades para o CT Pandora. Artes marciais digitalizadas.">
  <meta name="keywords" content="dojo, jiu-jitsu, MMA, academia, check-in, gestão">
  <meta name="author" content="CT Pandora">
  <meta name="robots" content="noindex, nofollow">

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Dojo Manager">
  <meta name="theme-color" content="#FFD700">
  <meta name="msapplication-TileColor" content="#000000">

  <!-- Ícones Apple (iOS) -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Splash screen: fundo preto enquanto carrega -->
  <style>
    body {
      background-color: #000000;
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    window.addEventListener('load', function(ev) {
      // KILL SWITCH: Unregister any existing service worker to force network update
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Service Worker Unregistered (Force Sync V11)');
          }
        });
      }

      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          const engine = await engineInitializer.initializeEngine({
            useColorEmoji: true,
            renderer: "canvaskit",
          });
          await engine.runApp();
        }
      });
    });
  </script>
</body>
</html>
